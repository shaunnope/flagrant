<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convexity</title>
    <script>
      (function () {
        var k = "flagrant";
        var m = null, c = null;
        try {
          m = localStorage.getItem(k + ".mode") || localStorage.getItem("theme");
          c = localStorage.getItem(k + ".colorTheme");
        } catch (e) {}
        if (m !== "light" && m !== "dark") m = "system";
        document.documentElement.setAttribute("data-mode-preference", m);
        if (m === "system") {
          m = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-mode", m);
        document.documentElement.setAttribute("data-color-theme", c || "cobalt");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
