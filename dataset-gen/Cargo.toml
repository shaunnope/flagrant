[package]
name = "dataset-gen"
version = "0.1.0"
edition = "2021"
description = "Downloads country flags + metadata and collates each flag's colour distribution into the Convexity game dataset."

[[bin]]
name = "dataset-gen"
path = "src/main.rs"

[[bin]]
name = "fetch-metadata"
path = "src/fetch_metadata.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
image = "0.25"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
